# Inviscid Burgers u_t + u u_x = 0, u(0, x) = -sin(pi x), u = 0 at x = -1, 1.
defaults:
  - base
  - domain: rect
  - pde: burgers
  - initial: sine
  - boundary: constant
  - model@models.kan_spline: kan_bsplines
  - model@models.mlp: mlp
  - _self_

domain: {start: [0.0, -1.0], end: [1.0, 1.0], steps: [201, 201]}
boundary: {value: 0.0}

models:
  kan_spline:
    features: [2, 11, 9, 7, 5, 3, 1]
    gridUpdateEvery: 250
    gridUpdateUntil: 1700
  mlp:
    features: [2, 65, 55, 45, 35, 30, 25, 15, 10, 1]

plots:
  solution: {outputNames: [u]}
  slices:
    outputNames: [u]
    times: [0.0, 0.2, 0.28, 0.31, 0.35, 0.4, 0.5, 0.75, 1.0]
