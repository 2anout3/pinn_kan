[project]
name = "experiments"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Artem", email = "a.vdovin@g.nsu.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.8",
    "torch>=2.15",
    "pinn-networks",
    "pinn-platform",
    "optuna>=5.1.0",
]

[project.scripts]
experiments = "experiments.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
pinn-networks = { workspace = true }
pinn-platform = { workspace = true }
