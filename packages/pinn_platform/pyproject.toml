[project]
name = "pinn-platform"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Artem", email = "a.vdovin@g.nsu.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.15",
    "numpy>=2.5",
    "h5py",
    "matplotlib",
    "omegaconf>=2.3",
    "hydra-core>=1.3.8",
    "pinn-networks",
]

[project.scripts]
pinn-platform = "pinn_platform.exc:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
pinn-networks = { workspace = true }
